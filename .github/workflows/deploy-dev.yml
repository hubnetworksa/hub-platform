name: Deploy hosted dev preview

# Pushing to `dev` rebuilds all three sites as Cloudflare Pages *preview*
# deployments (wrangler's --branch=dev gives each its own
# dev.<project>.pages.dev URL) plus the small landing page that links them
# together — see dev-landing/. Cloudflare Access sits in front of all four
# hostnames (configured once in the Cloudflare dashboard, not here — see
# SETUP.md "Hosted dev environment"), so this is the "hosted dev with a
# login page" environment: merge dev -> main once you're happy with it here,
# which runs deploy.yml against the real production domains.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-dev
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: polokwane
            site_upper: POLOKWANE
            pages_project: polokwanehub
          - site: pretoria
            site_upper: PRETORIA
            pages_project: pretoriahub
          - site: capetown
            site_upper: CAPETOWN
            pages_project: thecapetownhub
    env:
      SITE: ${{ matrix.site }}
      # Same per-site credential secrets as deploy.yml — see its comment.
      CLOUDFLARE_API_TOKEN: ${{ secrets[format('CLOUDFLARE_API_TOKEN_{0}', matrix.site_upper)] }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets[format('CLOUDFLARE_ACCOUNT_ID_{0}', matrix.site_upper)] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Read-only: pulls this site's current *published* data for preview.
      # No migrations, no routine-SQL apply, no snapshot commits here — this
      # branch is for reviewing code/content changes, not for mutating D1.
      - name: Fetch D1 data
        run: npm run fetch-data

      - name: Select site assets
        run: npm run select-assets

      - name: Build with Astro
        run: npx astro build

      # See the matching comment in deploy.yml — `wrangler pages deploy` only
      # reads a literal ./wrangler.jsonc, no --config flag, so the per-site
      # config has to be copied into place under that name right before this.
      - name: Deploy preview to Cloudflare Pages
        run: |
          cp wrangler.${{ matrix.site }}.jsonc wrangler.jsonc
          npx wrangler pages deploy dist --project-name=${{ matrix.pages_project }} --branch=dev --commit-dirty=true

  deploy-landing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy landing page to Cloudflare Pages
        env:
          # Reuses Pretoria's credentials rather than a dedicated pair —
          # this project isn't tied to any one site, but right now every
          # site lives on the same Cloudflare account anyway, so a separate
          # CLOUDFLARE_API_TOKEN_DEV/CLOUDFLARE_ACCOUNT_ID_DEV pair would
          # just be a duplicate of these same values. If this project ever
          # needs to move to a different account, switch back to its own
          # named secrets then.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRETORIA }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PRETORIA }}
        run: npx wrangler pages deploy dev-landing --project-name=hub-platform-dev --branch=dev
