name: Deploy Hub Admin

# Builds and deploys the Hub Admin app (admin-app/) to the hub-admin
# Cloudflare Pages project (hub-admin-b4x.pages.dev), creating the project and
# its own database on the first run. The app reads every city's D1 database
# (bindings in admin-app/wrangler.jsonc). Sign-in is the app's own username +
# password / passkeys; the first account is created with the setup code from
# the HUB_ADMIN_SETUP_CODE repository secret (see admin-app/README.md).

on:
  push:
    branches: [main]
    paths:
      - "admin-app/**"
      - "sites/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HAS_SETUP_CODE: ${{ secrets.HUB_ADMIN_SETUP_CODE != '' }}
      HAS_RESEND_KEY: ${{ secrets.HUB_ADMIN_RESEND_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck admin Functions
        run: npx --yes -p typescript@5 tsc -p admin-app/tsconfig.json

      - name: Create the Pages project if it doesn't exist yet
        working-directory: admin-app
        run: |
          if ../node_modules/.bin/wrangler pages project list | grep -q "hub-admin"; then
            echo "hub-admin already exists"
          else
            ../node_modules/.bin/wrangler pages project create hub-admin --production-branch=main
          fi

      # Hub Admin's own database: created on the first run, then its id is
      # written into both configs (it isn't committed, so the repo never has
      # to be edited by hand after the database exists).
      - name: Create the admin database if needed and fill in its id
        working-directory: admin-app
        run: |
          db_id() {
            ../node_modules/.bin/wrangler d1 list --json | node -e '
              const t = require("fs").readFileSync(0, "utf8");
              const list = JSON.parse(t.slice(t.indexOf("[")));
              const d = list.find((x) => x.name === "hub-admin-db");
              process.stdout.write(d ? d.uuid : "");'
          }
          ID=$(db_id)
          if [ -z "$ID" ]; then
            ../node_modules/.bin/wrangler d1 create hub-admin-db
            ID=$(db_id)
          fi
          if [ -z "$ID" ]; then echo "Could not find or create hub-admin-db"; exit 1; fi
          sed -i "s/__HUB_ADMIN_DB_ID__/$ID/" wrangler.jsonc
          echo "hub-admin-db: $ID"

      - name: Apply admin database migrations
        working-directory: admin-app
        run: ../node_modules/.bin/wrangler d1 migrations apply hub-admin-db --remote

      # The first-time setup / password-reset code. Stored as an encrypted
      # Pages secret (never in the repo or the logs); takes effect with the
      # deploy below.
      - name: Set the setup code
        if: env.HAS_SETUP_CODE == 'true'
        working-directory: admin-app
        env:
          SETUP_CODE: ${{ secrets.HUB_ADMIN_SETUP_CODE }}
        run: printf '%s' "$SETUP_CODE" | ../node_modules/.bin/wrangler pages secret put SETUP_CODE --project-name=hub-admin

      # Optional: a Resend API key so the Monday weekly summary is also
      # emailed (Settings → Weekly summary email). Encrypted Pages secret.
      - name: Set the email key
        if: env.HAS_RESEND_KEY == 'true'
        working-directory: admin-app
        env:
          KEY: ${{ secrets.HUB_ADMIN_RESEND_KEY }}
        run: printf '%s' "$KEY" | ../node_modules/.bin/wrangler pages secret put RESEND_API_KEY --project-name=hub-admin

      # Run from admin-app/ so wrangler picks up admin-app/wrangler.jsonc
      # (bindings and vars) and admin-app/functions/.
      - name: Deploy
        working-directory: admin-app
        run: ../node_modules/.bin/wrangler pages deploy public --project-name=hub-admin --branch=main --commit-dirty=true
