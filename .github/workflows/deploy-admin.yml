name: Deploy Hub Admin

# Builds and deploys the Hub Admin app (admin-app/) to the hub-admin
# Cloudflare Pages project — creating the project on the first run. The app
# reads every city's D1 database (bindings in admin-app/wrangler.jsonc) and
# stays locked until Cloudflare Access is configured (see admin-app/README.md).

on:
  push:
    branches: [main]
    paths:
      - "admin-app/**"
      - "sites/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck admin Functions
        run: npx --yes -p typescript@5 tsc -p admin-app/tsconfig.json

      - name: Create the Pages project if it doesn't exist yet
        working-directory: admin-app
        run: |
          if ../node_modules/.bin/wrangler pages project list | grep -q "hub-admin"; then
            echo "hub-admin already exists"
          else
            ../node_modules/.bin/wrangler pages project create hub-admin --production-branch=main
          fi

      # Run from admin-app/ so wrangler picks up admin-app/wrangler.jsonc
      # (bindings and vars) and admin-app/functions/.
      - name: Deploy
        working-directory: admin-app
        run: ../node_modules/.bin/wrangler pages deploy public --project-name=hub-admin --branch=main --commit-dirty=true
