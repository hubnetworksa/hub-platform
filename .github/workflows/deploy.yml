name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # The research routines commit to main every hour. Deploying on each of
  # those commits rebuilt all three sites (every build reads the whole
  # database), which burned through D1's free daily read allowance. Routine
  # commits are now picked up by this schedule instead, in batches, and only
  # for the cities that actually have pending routine SQL.
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:
    inputs:
      sites:
        description: "Cities to deploy: all, or a comma-separated list (capetown,pretoria,polokwane)"
        required: false
        default: "all"

permissions:
  contents: write
  deployments: write

# Queue rather than cancel: a cancelled run can stop halfway through
# applying routine SQL, and a scheduled batch shouldn't be dropped just
# because a code push landed at the same moment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Decides which cities this run should build, so a change to one city
  # never re-reads the other two cities' databases.
  #   push:     code/shared changes -> all three cities.
  #             routine-only changes (db/routine-updates/, status/,
  #             ROUTINE.*.md) -> nothing now; the schedule applies them.
  #   schedule: only cities with pending db/routine-updates/<city>/*.sql.
  #   manual:   the cities named in the "sites" input (default all).
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out which cities to build
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          INPUT_SITES: ${{ github.event.inputs.sites }}
        run: |
          node - <<'JS'
          const { execSync } = require('child_process');
          const fs = require('fs');
          const ALL = [
            { site: 'polokwane', pages_project: 'polokwanehub' },
            { site: 'pretoria', pages_project: 'pretoriahub' },
            { site: 'capetown', pages_project: 'thecapetownhub' },
          ];
          const names = ALL.map((s) => s.site);
          const { EVENT, BEFORE, AFTER, INPUT_SITES } = process.env;
          const pending = (c) => {
            try { return fs.readdirSync(`db/routine-updates/${c}`).some((f) => f.endsWith('.sql')); } catch { return false; }
          };
          let chosen;
          if (EVENT === 'schedule') {
            chosen = names.filter(pending);
          } else if (EVENT === 'workflow_dispatch') {
            const want = (INPUT_SITES || 'all').trim();
            chosen = want === 'all' ? names : want.split(',').map((s) => s.trim()).filter((s) => names.includes(s));
          } else {
            let files = null;
            if (BEFORE && !/^0+$/.test(BEFORE)) {
              try { files = execSync(`git diff --name-only ${BEFORE} ${AFTER}`, { encoding: 'utf8' }).split(/\r?\n/).filter(Boolean); } catch { files = null; }
            }
            // Hub Admin (admin-app/) deploys separately (deploy-admin.yml); its
            // files never need the city sites rebuilt.
            const adminOnly = (f) => f.startsWith('admin-app/') || f === '.github/workflows/deploy-admin.yml' || f === 'assets/logo-src/hub-admin.svg' || f === 'scripts/render-admin-icons.mjs' || f === 'scripts/admin-notify.mjs' || f === 'scripts/render-admin-banner.mjs' || f === '.github/workflows/admin-notify.yml' || f === '.github/workflows/admin-weekly.yml' || f === 'scripts/admin-links.mjs' || f === '.github/workflows/admin-google.yml' || f === 'scripts/search-console-daily.mjs';
            const routineOnly = (f) => f.startsWith('db/routine-updates/') || f.startsWith('status/') || /^ROUTINE\.[a-z]+\.md$/.test(f) || adminOnly(f);
            if (files === null) chosen = names; // unknown range (new branch, force push): be safe
            else if (files.length > 0 && files.every(routineOnly)) chosen = [];
            else chosen = names;
          }
          const matrix = { include: ALL.filter((s) => chosen.includes(s.site)) };
          console.log(`Event: ${EVENT}. Building: ${chosen.join(', ') || 'nothing'}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'matrix=' + JSON.stringify(matrix) + '\n' + 'any=' + (chosen.length > 0) + '\n');
          JS

  deploy:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SITE: ${{ matrix.site }}
      # One shared pair for every site — they're all on the same
      # consolidated Cloudflare account.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Before anything touches the live databases: a Pages Function that
      # doesn't typecheck must never reach migrations or a deploy.
      - name: Typecheck Pages Functions
        run: npm run typecheck:functions

      - name: Apply D1 migrations
        run: npm run db:migrate:remote

      # The hourly research routine (a cloud agent with no Cloudflare
      # credentials of its own) proposes new/enriched business data as SQL
      # files under db/routine-updates/<site>/ and commits them. This is
      # where those actually get applied. Every statement in these files
      # must be idempotent (INSERT OR IGNORE / UPDATE ... WHERE x IS NULL)
      # — see ROUTINE.<site>.md — since a file can be applied more than
      # once safely.
      - name: Apply pending routine SQL updates
        run: |
          shopt -s nullglob
          files=(db/routine-updates/${{ matrix.site }}/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No pending routine updates."
          else
            for f in "${files[@]}"; do
              echo "Applying $f"
              npx wrangler d1 execute "$(node -e "console.log(require('./sites/${{ matrix.site }}.json').dbName)")" \
                --config "wrangler.${{ matrix.site }}.jsonc" --remote --file="$f"
              # INSERT OR IGNORE silently skips rows that break a NOT NULL
              # constraint; warn (never fail) if any events/news row is missing.
              if grep -qiE 'INTO[[:space:]]+(events|news)\b' "$f"; then
                node scripts/routines/verify-applied.mjs "$f" --site ${{ matrix.site }} || true
              fi
            done
          fi

      # Each matrix leg only ever touches its own db/routine-updates/<site>/
      # and status/<site>/ paths, so these commits never conflict in
      # *content* — only in git ref order, since all three legs push to the
      # same main branch in parallel. Retry with a rebase pull handles that;
      # a real conflict here would mean two legs touched the same file,
      # which shouldn't happen by construction.
      - name: Clear applied routine SQL files
        run: |
          shopt -s nullglob
          files=(db/routine-updates/${{ matrix.site }}/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No routine SQL files to clear."
            exit 0
          fi
          git rm -q "${files[@]}"
          git config user.name "hub-platform-bot"
          git config user.email "actions@github.com"
          git commit -m "Clear applied ${{ matrix.site }} routine SQL files [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."; sleep $((RANDOM % 5 + 1))
          done

      # Give every event that has no image yet an AI-generated poster
      # (Cloudflare Workers AI, FLUX schnell) and store it in this site's R2
      # bucket. Only touches events with image_url IS NULL, so a real photo is
      # never replaced, and it runs after the routine SQL above so events added
      # in this deploy get their poster in this same build. Capped per run;
      # well inside the free daily AI allowance. continue-on-error: a failure
      # here (e.g. the API token lacks the Workers AI permission) must never
      # stop the site from deploying.
      - name: Generate AI posters for events without an image
        continue-on-error: true
        run: node scripts/generate-event-images.mjs --site ${{ matrix.site }} --limit 20

      - name: Build with Astro
        run: npm run build

      # `wrangler pages deploy` only ever reads a literal ./wrangler.jsonc
      # in the working directory — it has no --config flag (unlike `d1`/`r2`
      # subcommands, used with --config elsewhere in this workflow) — so the
      # per-site config has to be copied into place under that exact name
      # right before deploying, or this site's SITE var and D1/R2 bindings
      # never reach the deployed Pages project (surfaces as a 500 from
      # every request, since functions/_lib/site.ts's getSite() throws on a
      # missing SITE).
      - name: Deploy to Cloudflare Pages
        run: |
          cp wrangler.${{ matrix.site }}.jsonc wrangler.jsonc
          npx wrangler pages deploy dist --project-name=${{ matrix.pages_project }} --branch=main --commit-dirty=true

      # The other half of the _headers fix (assets/sites/<site>/_headers):
      # even with `must-revalidate` on every HTML response, a visitor's
      # first request after a deploy still pays one stale-then-revalidate
      # round trip unless the edge cache is explicitly cleared. Zone ID
      # comes from sites/<site>.json — null for a site not cut over to a
      # real domain yet (no zone to purge), in which case this step is a
      # no-op. continue-on-error so a token missing the Zone.Cache Purge
      # permission degrades to "no purge" rather than failing every site's
      # deploy — check the Actions log if purges aren't taking effect.
      - name: Purge Cloudflare cache
        continue-on-error: true
        run: |
          ZONE_ID="$(node -e "console.log(require('./sites/${{ matrix.site }}.json').cloudflareZoneId || '')")"
          if [ -z "$ZONE_ID" ]; then
            echo "No cloudflareZoneId set for ${{ matrix.site }} yet — skipping cache purge."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      # Ping IndexNow (Bing, Yandex, Seznam, ...) with the URLs this deploy
      # added or changed: the fresh dist/ sitemap compared with
      # status/<site>/indexnow-state.json, which the next step commits along
      # with the DB snapshot. The key file it points engines at is
      # public/<key>.txt (scripts/indexnow-key.mjs). continue-on-error: an
      # IndexNow outage or rejection only leaves a warning on the run; the
      # state file isn't updated then, so the next deploy retries.
      - name: Submit changed URLs to IndexNow
        continue-on-error: true
        run: node scripts/indexnow-submit.mjs --site ${{ matrix.site }}

      # Refresh the committed snapshot the routine reads
      # (status/<site>/db-snapshot.json) from the same data the build just
      # fetched, so the next routine run sees today's real state. [skip ci]
      # stops this push from re-triggering this same workflow.
      - name: Refresh DB snapshot for the routine
        run: |
          node scripts/write-db-snapshot.mjs
          git config user.name "hub-platform-bot"
          git config user.email "actions@github.com"
          git add status/${{ matrix.site }}/db-snapshot.json
          if [ -f status/${{ matrix.site }}/indexnow-state.json ]; then
            git add status/${{ matrix.site }}/indexnow-state.json
          fi
          if git diff --staged --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "Refresh ${{ matrix.site }} DB snapshot [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."; sleep $((RANDOM % 5 + 1))
            done
          fi
