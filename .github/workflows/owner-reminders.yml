name: Owner confirmation reminders

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: polokwane
          - site: pretoria
          - site: capetown
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Call process-owner-reminders
        run: |
          HOST=$(node -e "
            const s = require('./sites/${{ matrix.site }}.json');
            console.log(s.domainLive ? s.domain : s.pagesDevHost);
          ")
          curl -sS -f -X POST "https://$HOST/api/admin/process-owner-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
