name: Subscription & sponsorship expiry sweep

on:
  schedule:
    # Every 6 hours: a cancelled plan or sponsorship comes off the public
    # pages within hours of its paid period ending, not up to a day later.
    - cron: "15 */6 * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: polokwane
          - site: pretoria
          - site: capetown
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Call process-expired-subscriptions
        run: |
          HOST=$(node -e "
            const s = require('./sites/${{ matrix.site }}.json');
            console.log(s.domainLive ? s.domain : s.pagesDevHost);
          ")
          curl -sS -f -X POST "https://$HOST/api/admin/process-expired-subscriptions" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
